# Local development stack (TRD §13.1). `docker compose up -d`
# ML services (TEI) are heavy; start them with `docker compose --profile ml up -d`.
services:
  mysql:
    image: mysql:8.4
    command:
      - --ngram_token_size=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lawassist
      MYSQL_USER: lawassist
      MYSQL_PASSWORD: lawassist
    ports: ['3306:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ['6333:6333', '6334:6334']
    volumes: [qdrant-data:/qdrant/storage]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]

  tei-embed:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ['--model-id', 'BAAI/bge-m3', '--port', '80']
    ports: ['8081:80']
    volumes: [tei-cache:/data]

  tei-rerank:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ['--model-id', 'BAAI/bge-reranker-v2-m3', '--port', '80']
    ports: ['8082:80']
    volumes: [tei-cache:/data]

volumes:
  mysql-data:
  qdrant-data:
  minio-data:
  tei-cache:
