# Local development stack (TRD §13.1). `docker compose up -d`
# ML services (TEI) are heavy; start them with `docker compose --profile ml up -d`.
services:
  mysql:
    image: mysql:8.4
    command:
      - --ngram_token_size=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lawassist
      MYSQL_USER: lawassist
      MYSQL_PASSWORD: lawassist
    ports: ['3306:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ['6333:6333', '6334:6334']
    volumes: [qdrant-data:/qdrant/storage]

  # S3-compatible object store for local dev (snapshots, uploads). MinIO stopped publishing
  # community images, so this uses SeaweedFS. No identities are configured, so its S3 API accepts
  # any credentials: local use only. Host port 9000 keeps S3_ENDPOINT unchanged.
  s3:
    image: chrislusf/seaweedfs:3.99
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333']
    ports: ['9000:8333']
    volumes: [s3-data:/data]

  # Creates the dev bucket once the store is up (no app code creates buckets; Terraform does in AWS).
  s3-init:
    image: chrislusf/seaweedfs:3.99
    depends_on: [s3]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until echo 's3.bucket.list' | weed shell -master=s3:9333 >/dev/null 2>&1; do sleep 1; done;
        echo 's3.bucket.create -name lawassist-dev' | weed shell -master=s3:9333
    restart: 'no'

  # Background worker (scraper schedules, SCOB, outbox indexing, scan pipeline) in its own image,
  # which has qpdf + Poppler. `docker compose --profile worker up -d --build worker`.
  # Reads .env; only the hosts change to the compose services (credentials are the local ones above).
  worker:
    profiles: [worker]
    build: { context: ., dockerfile: apps/worker/Dockerfile, target: runtime }
    image: lawassist-worker
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://root:root@mysql:3306/lawassist
      SCRAPER_DATABASE_URL: ''
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://s3:8333
      TEI_EMBED_URL: http://tei-embed:80
      TEI_RERANK_URL: http://tei-rerank:80
      FCM_SERVICE_ACCOUNT_FILE: /secrets/firebase-service-account.json
    volumes: ['./secrets:/secrets:ro']
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    restart: unless-stopped

  tei-embed:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ['--model-id', 'BAAI/bge-m3', '--port', '80']
    ports: ['8081:80']
    volumes: [tei-cache:/data]

  tei-rerank:
    profiles: [ml]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ['--model-id', 'BAAI/bge-reranker-v2-m3', '--port', '80']
    ports: ['8082:80']
    volumes: [tei-cache:/data]

volumes:
  mysql-data:
  qdrant-data:
  s3-data:
  tei-cache:
